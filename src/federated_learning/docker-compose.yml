name: gridfm-flower

services:
  superlink:
    image: flwr/superlink:1.23.0
    command:
      - --insecure
      - --isolation
      - process
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - flwr-network

  supernode-1:
    image: flwr/supernode:1.23.0
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --clientappio-api-address
      - 0.0.0.0:9094
      - --isolation
      - process
      - --node-config
      - "partition-id=0 num-partitions=2"
    networks:
      - flwr-network
    depends_on:
      - superlink

  supernode-2:
    image: flwr/supernode:1.23.0
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --clientappio-api-address
      - 0.0.0.0:9095
      - --isolation
      - process
      - --node-config
      - "partition-id=1 num-partitions=2"
    networks:
      - flwr-network
    depends_on:
      - superlink

  serverapp:
    image: gridfm-flower-serverapp:1.23.0
    build:
      context: images/server
    command:
      - --insecure
      - --plugin-type
      - serverapp
      - --appio-api-address
      - superlink:9091
    networks:
      - flwr-network
    depends_on:
      - superlink

  clientapp-1:
    image: gridfm-flower-clientapp:1.23.0
    build:
      context: images/client
    command:
      - --insecure
      - --plugin-type
      - clientapp
      - --appio-api-address
      - supernode-1:9094
    networks:
      - flwr-network
    depends_on:
      - serverapp
      - supernode-1

  clientapp-2:
    image: gridfm-flower-clientapp:1.23.0
    command:
      - --insecure
      - --plugin-type
      - clientapp
      - --appio-api-address
      - supernode-2:9095
    networks:
      - flwr-network
    depends_on:
      - serverapp
      - supernode-2

networks:
  flwr-network:
    driver: bridge
