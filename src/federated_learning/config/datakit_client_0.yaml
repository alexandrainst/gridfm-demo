network:
  name: case14_ieee
  source: pglib
  network_dir: none

load:
  generator: agg_load_profile
  agg_profile: default
  scenarios: 20
  sigma: 0.2
  change_reactive_power: true
  global_range: 0.4
  max_scaling_factor: 4.0
  step_size: 0.025
  start_scaling_factor: 0.8

topology_perturbation:
  type: random
  k: 1
  n_topology_variants: 2
  elements: [line, gen]

generation_perturbation:
  type: cost_permutation
  sigma: 1.0

admittance_perturbation:
  type: random_perturbation
  sigma: 0.2

settings:
  num_processes: 1
  data_dir: data/federated_learning/client_0
  large_chunk_size: 10
  no_stats: false
  overwrite: true
  mode: pf
  seed: 1001
  include_dc_res: true
  enable_solver_logs: false
  pf_fast: true
  dcpf_fast: true
  max_iter: 200
