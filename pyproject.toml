[project]
name = "gridfm_demo"
version = "0.0.0"
description = "Demonstration of how federated learning can train a foundation model for the power grid."
readme = "README.md"
authors = [
  {name = "Étienne Bourbeau", email = "27770178+bourdeet@users.noreply.github.com"},
  {name = "Michael Iversen", email = "michael.iversen@alexandra.dk"},
]
maintainers = [
  {name = "Étienne Bourbeau", email = "27770178+bourdeet@users.noreply.github.com"},
  {name = "Michael Iversen", email = "michael.iversen@alexandra.dk"},
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "gridfm-datakit",
    "gridfm-graphkit",
    "matplotlib>=3.11.0",
    "pandapower>=3.5.4",
    "numpy>=2.4.6",
    "typer>=0.12.5",
    "flwr==1.23.0",
]

[project.scripts]
gridfm = "gridfm_cli.main:app"

[project.urls]
Repository = "https://github.com/alexandrainst/gridfm-demo"
Issues = "https://github.com/alexandrainst/gridfm-demo/issues"

[project.license]
text = "MIT"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "pre-commit>=4.3.0",
  "readme-coverage-badger>=1.0.1",
  "ruff>=0.15.1",
  "ty>=0.0.29",
  "nbstripout>=0.9.0",
  "coverage>=7.10.5",
]

[tool.ruff]
line-length = 88
exclude = [
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
]
extend-include = [
  "*.ipynb",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
preview = true
select = [
  # Imports
  "I",
  "PLC0415",
  # Docstrings
  "D",
  "DOC",
  # pycodestyle errors and warnings (PEP8)
  "E",
  "W",
  # flake-annotations (type hints)
  "ANN",
  # Pyflakes
  "F",
]
ignore = [
  # Type annotations for "self" arguments
  "ANN101",
  # Type annotations for "cls" arguments
  "ANN102",
  # Type annotations for *args
  "ANN002",
  # Type annotations for **kwargs
  "ANN003",
  # Always add blank line before class docstring
  "D203",
  # No new-line as first line of docstring
  "D213",
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = [
  "F401",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "8.4.1"
addopts = [
  '--durations=10',
  '--color=yes',
  '--doctest-modules',
  '--cov=flower_app',
]
xfail_strict = true
filterwarnings = [
  "error",
  "ignore::UserWarning",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
  "ignore::ImportWarning",
  "ignore::ResourceWarning",
  "ignore::FutureWarning",
]
log_cli_level = "info"
# Not `flower_app`: collecting its doctests imports gridfm-graphkit, which needs
# `torch_scatter` (installed only in the Flower images).
testpaths = [
  "tests",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
# `gridfm-datakit` imports `juliapkg.deps.run_julia`, which juliapkg 0.1.26 removed.
constraint-dependencies = ["juliapkg<0.1.26"]

[tool.uv.sources]
# We pin the gridfm repos on the commit corresponding to the latest release.
# We also point to Alexandra's own fork of the project, in case we need adapt these projects.
gridfm-datakit = { git = "https://github.com/alexandrainst/gridfm-datakit" , rev="a3fc228" }
gridfm-graphkit = { git = "https://github.com/alexandrainst/gridfm-graphkit", rev="b3d663b" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flower_app", "gridfm_cli"]

[tool.flwr.app]
publisher = "alexandra"

[tool.flwr.app.components]
serverapp = "flower_app.server_app:app"
clientapp = "flower_app.client_app:app"

# Defaults of every run config key. `flwr run --run-config` only overrides keys
# declared here, so a new experiment's keys must be added with a default. Each
# experiment's keys are in a table named after it, which Flower flattens to
# `<experiment>.<key>`.
[tool.flwr.app.config]
experiment = "fedavg"

[tool.flwr.app.config.fedavg]
num-server-rounds = 3
local-epochs = 1

[tool.flwr.federations]
default = "local-deployment"

[tool.flwr.federations.local-deployment]
address = "127.0.0.1:9093"
insecure = true
