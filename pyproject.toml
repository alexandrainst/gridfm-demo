[project]
name = "gridfm_demo"
version = "0.0.0"
description = "Demo case bencharking gridFM-derived power flow solutions with state-of-the-art deterministic solutions from pandapower."
readme = "README.md"
authors = [
  {name = "Étienne Bourbeau", email = "27770178+bourdeet@users.noreply.github.com"},
]
maintainers = [
  {name = "Étienne Bourbeau", email = "27770178+bourdeet@users.noreply.github.com"},
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "gridfm-datakit",
    "gridfm-graphkit",
    "appfl",
    "matplotlib>=3.11.0",
    "pandapower>=3.5.4",
    "numpy>=2.4.6",
    "flwr[simulation]==1.23.0",
]

[project.urls]
Repository = "https://github.com/alexandrainst/gridfm_demo"
Issues = "https://github.com/alexandrainst/gridfm_demo/issues"

[project.license]
text = "Proprietary"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "pre-commit>=4.3.0",
  "readme-coverage-badger>=1.0.1",
  "click",
  "ruff>=0.15.1",
  "ty>=0.0.29",
  "nbstripout>=0.9.0",
  "coverage>=7.10.5",
  "pip>=25.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
]
extend-include = [
  "*.ipynb",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
preview = true
select = [
  # Imports
  "I",
  "PLC0415",
  # Docstrings
  "D",
  "DOC",
  # pycodestyle errors and warnings (PEP8)
  "E",
  "W",
  # flake-annotations (type hints)
  "ANN",
  # Pyflakes
  "F",
]
ignore = [
  # Type annotations for "self" arguments
  "ANN101",
  # Type annotations for "cls" arguments
  "ANN102",
  # Type annotations for *args
  "ANN002",
  # Type annotations for **kwargs
  "ANN003",
  # Always add blank line before class docstring
  "D203",
  # No new-line as first line of docstring
  "D213",
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = [
  "F401",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "8.4.1"
addopts = [
  '--durations=10',
  '--color=yes',
  '--doctest-modules',
  '--cov=src/gridfm_demo',
]
xfail_strict = true
filterwarnings = [
  "error",
  "ignore::UserWarning",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
  "ignore::ImportWarning",
  "ignore::ResourceWarning",
  "ignore::FutureWarning",
]
log_cli_level = "info"
testpaths = [
  "tests",
  "src/gridfm_demo",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
# We pin the gridfm and APPFL repos on the commit corresponding to the latest release.
# We also point to Alexandra's own fork of the project, in case we need adapt these projects.
gridfm-datakit = { git = "https://github.com/alexandrainst/gridfm-datakit" , branch="a3fc228" }
gridfm-graphkit = { git = "https://github.com/alexandrainst/gridfm-graphkit", branch="b3d663b" }
appfl = { git = "https://github.com/alexandrainst/APPFL.git", branch="ea523e3" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.flwr.app]
publisher = "alexandra"

[tool.flwr.app.components]
# Flower's FAB extractor puts the archive root on sys.path but does not
# strip src/ (no src-layout support), so the module path includes `src.`.
serverapp = "src.federated_learning.server_app:app"
clientapp = "src.federated_learning.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3

[tool.flwr.federations]
default = "local-deployment"

[tool.flwr.federations.local-deployment]
address = "127.0.0.1:9093"
insecure = true
