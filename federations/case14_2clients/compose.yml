services:
  superlink:
    image: flwr/superlink:1.23.0
    command:
      - --insecure
      - --isolation
      - process
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - flwr-network

  supernode-1:
    image: flwr/supernode:1.23.0
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --clientappio-api-address
      - 0.0.0.0:9094
      - --isolation
      - process
      - --node-config
      - "client-id=0 data-dir='/data/client_0' networks='case14_ieee' scenarios='40'"
    networks:
      - flwr-network
    depends_on:
      - superlink

  supernode-2:
    image: flwr/supernode:1.23.0
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --clientappio-api-address
      - 0.0.0.0:9095
      - --isolation
      - process
      - --node-config
      - "client-id=1 data-dir='/data/client_1' networks='case14_ieee' scenarios='40'"
    networks:
      - flwr-network
    depends_on:
      - superlink

  serverapp:
    image: gridfm-flower-serverapp:1.23.0
    build:
      context: ../../build/server
    command:
      - --insecure
      - --plugin-type
      - serverapp
      - --appio-api-address
      - superlink:9091
    volumes:
      - ../../outputs/case14_2clients:/outputs
    networks:
      - flwr-network
    depends_on:
      - superlink

  clientapp-1:
    image: gridfm-flower-clientapp:1.23.0
    build:
      context: ../../build/client
    command:
      - --insecure
      - --plugin-type
      - clientapp
      - --appio-api-address
      - supernode-1:9094
    # PyTorch otherwise starts one OpenMP thread per host core in every ClientApp,
    # and the ClientApps oversubscribe the CPU while training tiny graphs.
    environment:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    volumes:
      - ./data/client_0:/data/client_0
    networks:
      - flwr-network
    depends_on:
      - serverapp
      - supernode-1

  clientapp-2:
    image: gridfm-flower-clientapp:1.23.0
    command:
      - --insecure
      - --plugin-type
      - clientapp
      - --appio-api-address
      - supernode-2:9095
    environment:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    volumes:
      - ./data/client_1:/data/client_1
    networks:
      - flwr-network
    depends_on:
      - serverapp
      - supernode-2

networks:
  flwr-network:
    driver: bridge
